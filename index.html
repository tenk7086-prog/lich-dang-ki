<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đăng ký lịch làm việc</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  .wrap { padding: 1.5rem 0; max-width: 680px; margin: 0 auto; width: 95%; }
  .page-title { font-size: 22px; font-weight: 500; color: var(--color-text-primary, #1d1d1f); margin-bottom: 4px; }
  .page-sub { font-size: 14px; color: var(--color-text-secondary, #86868b); margin-bottom: 1.5rem; }
  .card { background: var(--color-background-primary, #ffffff); border: 0.5px solid var(--color-border-tertiary, #d2d2d7); border-radius: var(--border-radius-lg, 12px); padding: 1.25rem; margin-bottom: 1rem; }
  .card-title { font-size: 13px; font-weight: 500; color: var(--color-text-secondary, #86868b); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group label { font-size: 13px; color: var(--color-text-secondary, #86868b); }
  .form-group input, .form-group select { height: 36px; padding: 0 10px; border-radius: var(--border-radius-md, 8px); border: 0.5px solid var(--color-border-secondary, #86868b); background: var(--color-background-secondary, #ffffff); color: var(--color-text-primary, #1d1d1f); font-size: 14px; font-family: var(--font-sans); outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--color-border-primary, #0071e3); box-shadow: 0 0 0 2px rgba(100,100,220,0.1); }
  .btn { height: 38px; padding: 0 16px; border-radius: var(--border-radius-md, 8px); border: 0.5px solid var(--color-border-secondary, #86868b); background: var(--color-background-primary, #ffffff); color: var(--color-text-primary, #1d1d1f); font-size: 14px; font-family: var(--font-sans); cursor: pointer; font-weight: 500; }
  .btn:hover { background: var(--color-background-secondary, #f5f5f7); }
  .btn:active { transform: scale(0.98); }
  .btn-full { width: 100%; }
  .status-banner { border-radius: var(--border-radius-md, 8px); padding: 10px 14px; font-size: 13px; margin-bottom: 1rem; display: flex; align-items: center; gap: 8px; }
  .status-open { background: #E1F5EE; color: #0F6E56; border: 0.5px solid #5DCAA5; }
  .status-closed { background: #FCEBEB; color: #A32D2D; border: 0.5px solid #F09595; }
  .status-upcoming { background: #FAEEDA; color: #633806; border: 0.5px solid #EF9F27; }
  .countdown { font-size: 12px; opacity: 0.8; margin-left: auto; }
  .section-label { font-size: 13px; font-weight: 500; color: var(--color-text-secondary, #86868b); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 8px; }
  .day-group { margin-bottom: 1.25rem; }
  .slots-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .slot { background: var(--color-background-primary, #ffffff); border: 0.5px solid var(--color-border-tertiary, #d2d2d7); border-radius: var(--border-radius-md, 8px); padding: 10px 12px; }
  .slot.full { background: var(--color-background-secondary, #f5f5f7); opacity: 0.6; }
  .slot-time { font-size: 13px; font-weight: 500; color: var(--color-text-primary, #1d1d1f); margin-bottom: 4px; }
  .slot-count { font-size: 12px; color: var(--color-text-secondary, #86868b); display: flex; align-items: center; gap: 4px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot-open { background: #1D9E75; }
  .dot-half { background: #EF9F27; }
  .dot-full { background: #E24B4A; }
  .slot-people { margin-top: 6px; }
  .person-tag { display: inline-flex; align-items: center; gap: 4px; background: var(--color-background-secondary, #f5f5f7); border: 0.5px solid var(--color-border-tertiary, #d2d2d7); border-radius: 20px; padding: 2px 8px; font-size: 11px; color: var(--color-text-secondary, #86868b); margin: 2px 2px 0 0; }
  .badge-full { display: inline-block; background: #FCEBEB; color: #A32D2D; font-size: 10px; padding: 1px 6px; border-radius: 20px; margin-left: 4px; border: 0.5px solid #F09595; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 1rem; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--color-text-secondary, #86868b); }
  .toast { background: var(--color-background-primary, #ffffff); border: 0.5px solid var(--color-border-secondary, #86868b); border-radius: var(--border-radius-md, 8px); padding: 10px 16px; font-size: 13px; color: var(--color-text-primary, #1d1d1f); margin-top: 12px; display: none; }
  .toast.show { display: block; }
  .toast.error { border-color: #E24B4A; color: #A32D2D; }
  .toast.success { border-color: #1D9E75; color: #0F6E56; }
</style>
</head>
<body>

<div class="wrap">
  <h2 class="sr-only">Đăng ký lịch làm việc trực tuyến</h2>

  <p class="page-title"><i class="ti ti-calendar-event" aria-hidden="true" style="font-size:20px;vertical-align:-2px;margin-right:6px;"></i>Đăng ký lịch làm</p>
  <p class="page-sub">Mỗi khung giờ nhận tối đa 2 người.</p>

  <div id="status-banner" class="status-banner status-closed">
    <i class="ti ti-lock-open" aria-hidden="true" style="font-size:16px;"></i>
    <span id="status-text">Đăng ký đang mở</span>
    <span class="countdown" id="countdown"></span>
  </div>

  <div class="card" id="register-card">
    <div class="card-title"><i class="ti ti-pencil" aria-hidden="true" style="font-size:15px;"></i> Thông tin đăng ký</div>
    <div class="form-row">
      <div class="form-group">
        <label>Tên của bạn</label>
        <input type="text" id="name" placeholder="Nguyễn Văn A" />
      </div>
      <div class="form-group">
        <label>Chọn ngày</label>
        <select id="day">
          <option value="">-- Chọn ngày --</option>
          <option value="T2">Thứ 2 (16/06)</option>
          <option value="T3">Thứ 3 (17/06)</option>
          <option value="T4">Thứ 4 (18/06)</option>
          <option value="T5">Thứ 5 (19/06)</option>
          <option value="T6">Thứ 6 (20/06)</option>
        </select>
      </div>
    </div>
    <div class="form-group" style="margin-bottom:12px;">
      <label>Chọn khung giờ</label>
      <select id="slot">
        <option value="">-- Chọn giờ --</option>
      </select>
    </div>
    <button class="btn btn-full" id="reg-btn" onclick="register()">
      <i class="ti ti-check" aria-hidden="true" style="font-size:15px;vertical-align:-1px;margin-right:4px;"></i>Đăng ký ca làm
    </button>
    <div class="toast" id="toast-reg"></div>
  </div>

  <div class="legend">
    <div class="legend-item"><span class="dot dot-open"></span>Còn chỗ</div>
    <div class="legend-item"><span class="dot dot-half"></span>Còn 1 chỗ</div>
    <div class="legend-item"><span class="dot dot-full"></span>Đã đủ người</div>
  </div>

  <p class="section-label"><i class="ti ti-list" aria-hidden="true" style="font-size:15px;vertical-align:-2px;margin-right:4px;"></i>Lịch đăng ký hiện tại</p>
  <div id="schedule"></div>
</div>

<script>
// ==================== LIÊN KẾT ĐÁM MÂY (GOOGLE SHEETS) ====================
// Nếu bạn có dùng Google Sheets, dán link Web App URL vào đây. Nếu không dùng hãy để trống "".
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzvXeYxYAqXkR3zysNveCPucTX3k5nnlUX_5aEzqmUHUqLaglipkybwhMDpbxIE1x58/exec"; 
// =========================================================================

const HOURS = ['08:00','09:00','10:00','11:00','13:00','14:00','15:00','16:00','17:00'];
const DAYS = ['T2','T3','T4','T5','T6'];
const DAY_LABELS = {T2:'Thứ 2 — 16/06',T3:'Thứ 3 — 17/06',T4:'Thứ 4 — 18/06',T5:'Thứ 5 — 19/06',T6:'Thứ 6 — 20/06'};
const MAX = 2;

let schedule = {};
DAYS.forEach(d => { schedule[d] = {}; HOURS.forEach(h => { schedule[d][h] = []; }); });

// Cấu hình giới hạn thời gian ẩn (Đặt tự động bằng mã code nếu thích, mặc định để null là luôn mở công khai)
let openTime = null;   
let closeTime = null;  

function isRegistrationOpen() {
  const now = new Date();
  if (!openTime && !closeTime) return true;
  if (openTime && now < openTime) return false;
  if (closeTime && now > closeTime) return false;
  return true;
}

function formatCountdown(target, prefix) {
  const diff = target - new Date();
  if (diff <= 0) return '';
  const h = Math.floor(diff / 3600000);
  const m = Math.floor((diff % 3600000) / 60000);
  const s = Math.floor((diff % 60000) / 1000);
  const parts = [];
  if (h > 0) parts.push(h + 'g');
  if (m > 0 || h > 0) parts.push(m + 'p');
  parts.push(s + 's');
  return prefix + ' ' + parts.join(' ');
}

function updateStatus() {
  const now = new Date();
  const banner = document.getElementById('status-banner');
  const statusText = document.getElementById('status-text');
  const countdown = document.getElementById('countdown');
  const regBtn = document.getElementById('reg-btn');

  if (!openTime && !closeTime) {
    banner.className = 'status-banner status-open';
    statusText.innerHTML = '<i class="ti ti-lock-open" style="font-size:16px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Đăng ký đang mở tự do';
    countdown.textContent = '';
    regBtn.disabled = false;
    return;
  }

  if (openTime && now < openTime) {
    banner.className = 'status-banner status-upcoming';
    statusText.innerHTML = '<i class="ti ti-clock" style="font-size:16px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Chưa đến giờ mở đăng ký · Mở lúc ' + openTime.toLocaleString('vi-VN');
    countdown.textContent = formatCountdown(openTime, 'Còn');
    regBtn.disabled = true;
    return;
  }

  if (closeTime && now > closeTime) {
    banner.className = 'status-banner status-closed';
    statusText.innerHTML = '<i class="ti ti-lock" style="font-size:16px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Đã hết thời gian đăng ký · Đóng lúc ' + closeTime.toLocaleString('vi-VN');
    countdown.textContent = '';
    regBtn.disabled = true;
    return;
  }

  banner.className = 'status-banner status-open';
  const cd = closeTime ? formatCountdown(closeTime, 'Đóng sau') : '';
  statusText.innerHTML = '<i class="ti ti-lock-open" style="font-size:16px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>Đăng ký đang mở';
  countdown.textContent = cd;
  regBtn.disabled = false;
}

function showToast(id, msg, type) {
  const t = document.getElementById(id);
  if(!t) return;
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

function updateSlotSelect() {
  const day = document.getElementById('day').value;
  const sel = document.getElementById('slot');
  sel.innerHTML = '<option value="">-- Chọn giờ --</option>';
  if (!day) return;
  HOURS.forEach(h => {
    const people = schedule[day][h];
    const rem = MAX - people.length;
    const suffix = rem === 0 ? ' (đã đủ)' : rem === 1 ? ' (còn 1 chỗ)' : ' (còn 2 chỗ)';
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = h + ' – ' + (parseInt(h)+1) + ':00' + suffix;
    if (rem === 0) opt.disabled = true;
    sel.appendChild(opt);
  });
}

document.getElementById('day').addEventListener('change', updateSlotSelect);

function register() {
  if (!isRegistrationOpen()) { showToast('toast-reg', 'Hiện tại không trong thời gian đăng ký.', 'error'); return; }
  const name = document.getElementById('name').value.trim();
  const day = document.getElementById('day').value;
  const hour = document.getElementById('slot').value;
  if (!name) { showToast('toast-reg', 'Vui lòng nhập tên của bạn.', 'error'); return; }
  if (!day) { showToast('toast-reg', 'Vui lòng chọn ngày.', 'error'); return; }
  if (!hour) { showToast('toast-reg', 'Vui lòng chọn khung giờ.', 'error'); return; }
  const slot = schedule[day][hour];
  if (slot.length >= MAX) { showToast('toast-reg', 'Khung giờ này đã đủ 2 người rồi!', 'error'); return; }
  if (slot.includes(name)) { showToast('toast-reg', 'Bạn đã đăng ký giờ này rồi.', 'error'); return; }

  if (SCRIPT_URL) {
    // Nếu có điền SCRIPT_URL kết nối Google Sheets
    const regBtn = document.getElementById('reg-btn');
    regBtn.disabled = true;
    regBtn.innerHTML = '<i class="ti ti-loader animate-spin"></i> Đang gửi dữ liệu...';
    
    fetch(SCRIPT_URL, {
      method: "POST",
      body: JSON.stringify({ action: "register", name: name, day: day, hour: hour })
    })
    .then(res => res.json())
    .then(data => {
      if (data.status === "success") {
        slot.push(name);
        showToast('toast-reg', 'Đăng ký thành công và đã lưu đám mây!', 'success');
        document.getElementById('name').value = '';
        document.getElementById('slot').value = '';
        updateSlotSelect();
        renderSchedule();
      }
    })
    .catch(() => { showToast('toast-reg', 'Lỗi lưu lên Google Sheets.', 'error'); })
    .finally(() => {
      regBtn.disabled = false;
      regBtn.innerHTML = '<i class="ti ti-check" aria-hidden="true"></i>Đăng ký ca làm';
    });
  } else {
    // Chạy offline lưu tạm cục bộ trên trình duyệt
    slot.push(name);
    showToast('toast-reg', 'Đăng ký thành công: ' + name + ' — ' + day + ' ' + hour, 'success');
    document.getElementById('name').value = '';
    document.getElementById('slot').value = '';
    updateSlotSelect();
    renderSchedule();
  }
}

function renderSchedule() {
  const container = document.getElementById('schedule');
  container.innerHTML = '';
  DAYS.forEach(day => {
    const group = document.createElement('div');
    group.className = 'day-group';
    const label = document.createElement('div');
    label.className = 'section-label';
    label.textContent = DAY_LABELS[day];
    group.appendChild(label);
    const grid = document.createElement('div');
    grid.className = 'slots-grid';
    HOURS.forEach(hour => {
      const people = schedule[day][hour];
      const count = people.length;
      const isFull = count >= MAX;
      const dotClass = count === 0 ? 'dot-open' : count === 1 ? 'dot-half' : 'dot-full';
      const statusText = count === 0 ? 'Còn 2 chỗ' : count === 1 ? 'Còn 1 chỗ' : 'Đã đủ';
      const slot = document.createElement('div');
      slot.className = 'slot' + (isFull ? ' full' : '');
      slot.innerHTML = '<div class="slot-time">' + hour + ' – ' + (parseInt(hour)+1) + ':00'
        + (isFull ? '<span class="badge-full">Đủ</span>' : '') + '</div>'
        + '<div class="slot-count"><span class="dot ' + dotClass + '"></span>' + statusText + '</div>'
        + '<div class="slot-people">'
        + people.map(p => '<span class="person-tag"><i class="ti ti-user" aria-hidden="true" style="font-size:11px;"></i>' + p + '</span>').join('')
        + '</div>';
      grid.appendChild(slot);
    });
    group.appendChild(grid);
    container.appendChild(group);
  });
}

// Chạy tải dữ liệu từ Google Sheets lên bảng tổng hợp ban đầu nếu có kết nối
if (SCRIPT_URL) {
  fetch(SCRIPT_URL)
    .then(res => res.json())
    .then(data => {
      if (data.status === "success" && data.registrations) {
        data.registrations.forEach(reg => {
          if (schedule[reg.day] && schedule[reg.day][reg.hour]) {
            schedule[reg.day][reg.hour].push(reg.name);
          }
        });
        renderSchedule();
        updateSlotSelect();
      }
    });
}

updateStatus();
renderSchedule();
setInterval(updateStatus, 1000);
</script>
</body>
</html>
